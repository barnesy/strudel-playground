<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Strudel Song Controller</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', 'Consolas', monospace;
            background: #000;
            color: #0f0;
            overflow-x: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: #000;
            border-bottom: 4px solid #0f0;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            color: #0f0;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            letter-spacing: 4px;
        }

        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #0a0;
            font-weight: bold;
        }

        /* Global Controls */
        .global-controls {
            background: #000;
            padding: 20px;
            border-bottom: 2px solid #0f0;
        }

        .control-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .btn {
            flex: 1;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: manipulation;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-play {
            background: #000;
            color: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .btn-play:active {
            background: #0f0;
            color: #000;
        }

        .btn-stop {
            background: #000;
            color: #f00;
            border-color: #f00;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .btn-stop:active {
            background: #f00;
            color: #000;
        }

        .btn-play.playing {
            background: #0f0;
            color: #000;
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 0, 1); }
        }

        /* Tempo Control */
        .tempo-control {
            background: #000;
            padding: 15px;
            border: 2px solid #0f0;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 95% 100%, 0 100%);
        }

        .tempo-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 900;
        }

        .bpm-display {
            font-size: 32px;
            color: #0f0;
            font-weight: 900;
            text-shadow: 0 0 10px #0f0;
        }

        .tempo-slider {
            width: 100%;
            height: 12px;
            background: #111;
            outline: none;
            -webkit-appearance: none;
            border: 2px solid #0f0;
        }

        .tempo-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            background: #0f0;
            cursor: pointer;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 10px #0f0;
        }

        /* Track Section */
        .tracks {
            padding: 20px;
        }

        .track {
            background: #000;
            margin-bottom: 16px;
            overflow: hidden;
            border: 3px solid #333;
            transition: all 0.2s;
            clip-path: polygon(0 0, 98% 0, 100% 5%, 100% 100%, 2% 100%, 0 95%);
        }

        .track.active {
            border-color: #0f0;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
        }

        .track-header {
            display: flex;
            align-items: center;
            padding: 16px;
            background: #111;
            border-bottom: 2px solid #222;
        }

        .track-toggle {
            width: 70px;
            height: 40px;
            background: #222;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 2px solid #333;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
        }

        .track-toggle.active {
            background: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .track-toggle::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #000;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        .track-toggle.active::after {
            left: 35px;
            background: #000;
        }

        .track-info {
            flex: 1;
            margin-left: 16px;
        }

        .track-name {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 4px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        .track-description {
            font-size: 11px;
            color: #0a0;
            font-weight: bold;
        }

        .track-controls {
            padding: 16px;
            background: #050505;
        }

        .pattern-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .pattern-btn {
            flex: 1;
            padding: 10px 6px;
            background: #000;
            border: 3px solid #333;
            color: #666;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s;
            font-family: 'Courier New', monospace;
        }

        .pattern-btn:active {
            transform: scale(0.95);
        }

        .pattern-btn.selected {
            background: #0f0;
            border-color: #0f0;
            color: #000;
            box-shadow: 0 0 10px #0f0;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .volume-label {
            font-size: 10px;
            color: #0a0;
            width: 60px;
            font-weight: 900;
        }

        .volume-slider, .effect-slider {
            flex: 1;
            height: 8px;
            background: #111;
            outline: none;
            -webkit-appearance: none;
            border: 2px solid #333;
        }

        .volume-slider::-webkit-slider-thumb,
        .effect-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #0f0;
            cursor: pointer;
            box-shadow: 0 0 8px #0f0;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 2px solid #0f0;
            padding: 12px;
            text-align: center;
            font-size: 10px;
            color: #0a0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>▶ SOUND SYSTEM ◀</h1>
            <div class="status" id="status">READY // TAP TO UNLEASH</div>
        </div>

        <!-- Global Controls -->
        <div class="global-controls">
            <div class="control-row">
                <button class="btn btn-play" id="playBtn">▶ ENGAGE</button>
                <button class="btn btn-stop" id="stopBtn">■ KILL</button>
            </div>

            <div class="tempo-control">
                <div class="tempo-label">
                    <span>Tempo</span>
                    <span class="bpm-display" id="bpmDisplay">120 BPM</span>
                </div>
                <input type="range" class="tempo-slider" id="tempoSlider"
                       min="60" max="180" value="120" step="5">
            </div>
        </div>

        <!-- Tracks -->
        <div class="tracks" id="tracks">
            <!-- Tracks will be dynamically generated -->
        </div>
    </div>

    <div class="footer">
        POWERED BY STRUDEL // LIVE CODING ENGINE // NO LIMITS
    </div>

    <!-- Load Strudel from CDN -->
    <script src="https://unpkg.com/@strudel/web@latest"></script>

    <script>
        // Track definitions
        const trackDefinitions = [
            {
                id: 'drums',
                name: 'Drums',
                description: 'Kick & Snare',
                color: '#ff6b6b',
                patterns: {
                    A: 'bd sd',
                    B: 'bd bd sd ~',
                    C: 'bd*2 ~ sd [bd sd]',
                    D: 'bd ~ ~ sd bd ~ sd ~',
                    E: '[bd bd] sd [bd sd] sd'
                }
            },
            {
                id: 'hihat',
                name: 'Hi-Hats',
                description: 'Rhythmic hats',
                color: '#4ecdc4',
                patterns: {
                    A: 'hh*4',
                    B: 'hh*8',
                    C: '~ hh hh ~',
                    D: 'hh*2 ~ hh*2 hh',
                    E: 'hh [hh hh] ~ hh*3'
                }
            },
            {
                id: 'bass',
                name: 'Bass',
                description: 'Low end groove',
                color: '#95e1d3',
                patterns: {
                    A: 'c2 e2 g2 c2',
                    B: 'c2 ~ e2 g2',
                    C: '<c2 e2 g2 a2>',
                    D: 'c2 [e2 g2] ~ a2',
                    E: 'c2*2 e2 [g2 a2] c3'
                },
                synth: 'sawtooth',
                effect: (pattern) => pattern.lpf(200)
            },
            {
                id: 'melody',
                name: 'Melody',
                description: 'Lead synth',
                color: '#f38181',
                patterns: {
                    A: 'c4 e4 g4 c5',
                    B: '<c4 e4 g4 c5>',
                    C: '[c4 e4] g4 [g4 c5] e4',
                    D: 'c4*2 [e4 g4] ~ c5',
                    E: '<[c4 e4] g4 [g4 a4] c5>'
                },
                synth: 'triangle'
            },
            {
                id: 'perc',
                name: 'Percussion',
                description: 'Extra rhythm',
                color: '#aa96da',
                patterns: {
                    A: '~ cp ~ cp',
                    B: 'cp*2 ~ cp ~',
                    C: 'oh*4',
                    D: 'cp ~ oh cp',
                    E: '[cp oh] ~ cp oh*2'
                }
            }
        ];

        // State management
        let strudelInitialized = false;
        let isPlaying = false;
        let currentBPM = 120;
        let trackStates = {};
        let trackPatterns = {};

        // Initialize track states
        trackDefinitions.forEach(track => {
            trackStates[track.id] = {
                enabled: false,
                selectedPattern: 'A',
                volume: 0.7,
                speed: 1,
                reverb: 0,
                delay: 0,
                degrade: 0
            };
        });

        // DOM elements
        const status = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const tempoSlider = document.getElementById('tempoSlider');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const tracksContainer = document.getElementById('tracks');

        // Initialize Strudel
        async function initializeStrudel() {
            if (!strudelInitialized) {
                try {
                    status.textContent = '>> LOADING SOUND BANKS <<';
                    console.log('Starting Strudel initialization...');

                    await window.initStrudel({
                        prebake: () => samples('github:tidalcycles/dirt-samples')
                    });

                    strudelInitialized = true;
                    status.textContent = '[ ARMED AND READY ]';
                    console.log('✅ Strudel initialized successfully');
                    console.log('Available functions:', Object.keys(window).filter(k => typeof window[k] === 'function' && k.includes('sound') || k.includes('note') || k.includes('stack')));
                    return true;
                } catch (error) {
                    status.textContent = 'XX ERROR: ' + error.message.toUpperCase();
                    console.error('Init error:', error);
                    return false;
                }
            }
            return true;
        }

        // Update all playing patterns
        function updatePatterns() {
            if (!isPlaying) return;

            try {
                // Stop all current patterns
                if (typeof window.hush === 'function') {
                    window.hush();
                }

                // Collect all enabled patterns
                const patterns = [];
                const enabledTracks = [];

                trackDefinitions.forEach(track => {
                    const state = trackStates[track.id];
                    console.log(`Track ${track.id}: enabled=${state.enabled}, pattern=${state.selectedPattern}`);

                    if (state.enabled) {
                        enabledTracks.push(track.name);
                        const pattern = buildPattern(track, state);
                        if (pattern) {
                            patterns.push(pattern);
                            console.log(`✓ Added pattern for ${track.name}`);
                        } else {
                            console.warn(`✗ Failed to build pattern for ${track.name}`);
                        }
                    }
                });

                console.log(`Enabled tracks: [${enabledTracks.join(', ')}]`);
                console.log(`Patterns collected: ${patterns.length}`);

                // If we have patterns, stack and play them
                if (patterns.length > 0) {
                    console.log(`Playing ${patterns.length} track(s)`);

                    if (typeof window.stack === 'function') {
                        window.stack(...patterns).play();
                        status.textContent = `>> ${patterns.length} CHANNEL${patterns.length > 1 ? 'S' : ''} ACTIVE <<`;
                    } else {
                        console.error('stack function not available');
                        status.textContent = 'XX SYSTEM ERROR';
                    }
                } else {
                    console.warn('No patterns to play. Enabled tracks:', enabledTracks.length);
                    status.textContent = '!! ENABLE TRACKS TO BEGIN !!';
                }
            } catch (error) {
                console.error('Error playing patterns:', error);
                status.textContent = '❌ Error: ' + error.message;
            }
        }

        // Build a pattern for a track
        function buildPattern(track, state) {
            try {
                // Check if Strudel functions are available
                if (typeof window.note === 'undefined' || typeof window.sound === 'undefined') {
                    console.error('Strudel functions not available yet');
                    return null;
                }

                const patternString = track.patterns[state.selectedPattern];
                let pattern;

                if (track.synth) {
                    // Melodic track
                    pattern = window.note(patternString).s(track.synth);
                    if (track.effect) {
                        pattern = track.effect(pattern);
                    }
                } else {
                    // Drum track
                    pattern = window.sound(patternString);
                }

                // Apply speed modifier
                if (state.speed !== 1) {
                    if (state.speed > 1) {
                        pattern = pattern.fast(state.speed);
                    } else {
                        pattern = pattern.slow(1 / state.speed);
                    }
                }

                // Apply effects
                if (state.reverb > 0) {
                    pattern = pattern.room(state.reverb);
                }

                if (state.delay > 0) {
                    pattern = pattern.delay(state.delay);
                }

                if (state.degrade > 0) {
                    pattern = pattern.degrade(state.degrade);
                }

                // Apply volume
                pattern = pattern.gain(state.volume);

                // Apply tempo (convert BPM to cycles per minute)
                pattern = pattern.cpm(currentBPM / 4);

                return pattern;
            } catch (error) {
                console.error(`Error building pattern for ${track.id}:`, error);
                return null;
            }
        }

        // Generate track UI
        function generateTrackUI() {
            tracksContainer.innerHTML = '';

            trackDefinitions.forEach(track => {
                const state = trackStates[track.id];
                const trackEl = document.createElement('div');
                trackEl.className = 'track' + (state.enabled ? ' active' : '');
                trackEl.id = `track-${track.id}`;

                trackEl.innerHTML = `
                    <div class="track-header">
                        <div class="track-toggle ${state.enabled ? 'active' : ''}"
                             data-track="${track.id}"></div>
                        <div class="track-info">
                            <div class="track-name">${track.name}</div>
                            <div class="track-description">${track.description}</div>
                        </div>
                    </div>
                    <div class="track-controls" style="${state.enabled ? '' : 'display:none'}">
                        <div class="pattern-selector">
                            <button class="pattern-btn ${state.selectedPattern === 'A' ? 'selected' : ''}"
                                    data-track="${track.id}" data-pattern="A">A</button>
                            <button class="pattern-btn ${state.selectedPattern === 'B' ? 'selected' : ''}"
                                    data-track="${track.id}" data-pattern="B">B</button>
                            <button class="pattern-btn ${state.selectedPattern === 'C' ? 'selected' : ''}"
                                    data-track="${track.id}" data-pattern="C">C</button>
                            <button class="pattern-btn ${state.selectedPattern === 'D' ? 'selected' : ''}"
                                    data-track="${track.id}" data-pattern="D">D</button>
                            <button class="pattern-btn ${state.selectedPattern === 'E' ? 'selected' : ''}"
                                    data-track="${track.id}" data-pattern="E">E</button>
                        </div>
                        <div class="volume-control">
                            <span class="volume-label">VOL</span>
                            <input type="range" class="volume-slider"
                                   data-track="${track.id}"
                                   min="0" max="1" step="0.1" value="${state.volume}">
                        </div>
                        <div class="volume-control">
                            <span class="volume-label">SPEED</span>
                            <input type="range" class="effect-slider"
                                   data-track="${track.id}" data-effect="speed"
                                   min="0.25" max="4" step="0.25" value="${state.speed}">
                        </div>
                        <div class="volume-control">
                            <span class="volume-label">REVERB</span>
                            <input type="range" class="effect-slider"
                                   data-track="${track.id}" data-effect="reverb"
                                   min="0" max="1" step="0.1" value="${state.reverb}">
                        </div>
                        <div class="volume-control">
                            <span class="volume-label">DELAY</span>
                            <input type="range" class="effect-slider"
                                   data-track="${track.id}" data-effect="delay"
                                   min="0" max="0.5" step="0.05" value="${state.delay}">
                        </div>
                        <div class="volume-control">
                            <span class="volume-label">CRUSH</span>
                            <input type="range" class="effect-slider"
                                   data-track="${track.id}" data-effect="degrade"
                                   min="0" max="1" step="0.1" value="${state.degrade}">
                        </div>
                    </div>
                `;

                tracksContainer.appendChild(trackEl);
            });

            // Add event listeners
            attachTrackListeners();
        }

        // Attach event listeners to track controls
        function attachTrackListeners() {
            // Track toggles
            document.querySelectorAll('.track-toggle').forEach(toggle => {
                toggle.addEventListener('click', async () => {
                    if (!strudelInitialized) {
                        await initializeStrudel();
                    }

                    const trackId = toggle.dataset.track;
                    const state = trackStates[trackId];
                    state.enabled = !state.enabled;

                    console.log(`Toggle ${trackId}: now ${state.enabled ? 'enabled' : 'disabled'}`);

                    generateTrackUI();
                    if (isPlaying) {
                        updatePatterns();
                    }
                });
            });

            // Pattern buttons
            document.querySelectorAll('.pattern-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const trackId = btn.dataset.track;
                    const pattern = btn.dataset.pattern;
                    trackStates[trackId].selectedPattern = pattern;

                    generateTrackUI();
                    if (isPlaying) {
                        updatePatterns();
                    }
                });
            });

            // Volume sliders
            document.querySelectorAll('.volume-slider').forEach(slider => {
                slider.addEventListener('input', () => {
                    const trackId = slider.dataset.track;
                    trackStates[trackId].volume = parseFloat(slider.value);

                    if (isPlaying) {
                        updatePatterns();
                    }
                });
            });

            // Effect sliders
            document.querySelectorAll('.effect-slider').forEach(slider => {
                slider.addEventListener('input', () => {
                    const trackId = slider.dataset.track;
                    const effect = slider.dataset.effect;
                    trackStates[trackId][effect] = parseFloat(slider.value);

                    if (isPlaying) {
                        updatePatterns();
                    }
                });
            });
        }

        // Play button
        playBtn.addEventListener('click', async () => {
            if (!await initializeStrudel()) return;

            isPlaying = true;
            playBtn.classList.add('playing');
            playBtn.textContent = '▶ ACTIVE';
            status.textContent = '>> SYSTEM RUNNING <<';

            console.log('=== Play button clicked ===');
            console.log('Track states:', JSON.stringify(trackStates, null, 2));

            updatePatterns();
        });

        // Stop button
        stopBtn.addEventListener('click', () => {
            isPlaying = false;
            playBtn.classList.remove('playing');
            playBtn.textContent = '▶ ENGAGE';
            status.textContent = 'SYSTEM TERMINATED';

            if (strudelInitialized && typeof window.hush === 'function') {
                window.hush();
            }
        });

        // Tempo slider
        tempoSlider.addEventListener('input', () => {
            currentBPM = parseInt(tempoSlider.value);
            bpmDisplay.textContent = `${currentBPM} BPM`;

            // Update patterns with new tempo if playing
            if (strudelInitialized && isPlaying) {
                updatePatterns();
            }
        });

        // Initialize UI
        generateTrackUI();
    </script>
</body>
</html>
