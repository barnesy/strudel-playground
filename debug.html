<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Debug</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #0a0a0a;
            color: #0f0;
        }

        .section {
            background: #1a1a1a;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #0f0;
            border-radius: 8px;
        }

        button {
            padding: 15px 25px;
            margin: 5px;
            font-size: 16px;
            background: #333;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            cursor: pointer;
        }

        button:active {
            background: #0f0;
            color: #000;
        }

        .state {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 12px;
        }

        .error {
            color: #f00;
        }

        .success {
            color: #0f0;
        }

        .warning {
            color: #ff0;
        }
    </style>
</head>
<body>
    <h1>🔍 Controller Debugger</h1>

    <div class="section">
        <h2>Test 1: Initialize Strudel</h2>
        <button id="test1">Run Test 1</button>
        <div id="result1" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Test 2: Check Global Functions</h2>
        <button id="test2">Run Test 2</button>
        <div id="result2" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Test 3: Create Patterns</h2>
        <button id="test3">Run Test 3</button>
        <div id="result3" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Test 4: Stack Patterns</h2>
        <button id="test4">Run Test 4</button>
        <div id="result4" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Test 5: Play Stacked Pattern</h2>
        <button id="test5">Run Test 5</button>
        <div id="result5" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Test 6: Stop All</h2>
        <button id="test6">Run Test 6</button>
        <div id="result6" class="state">Not run yet</div>
    </div>

    <div class="section">
        <h2>Current State</h2>
        <div id="stateDisplay" class="state">
            <pre id="stateContent">No state yet</pre>
        </div>
    </div>

    <script src="https://unpkg.com/@strudel/web@latest"></script>

    <script>
        let initialized = false;
        let testPatterns = [];

        function log(id, message, type = 'info') {
            const el = document.getElementById(id);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            el.innerHTML = `<span class="${className}">${message}</span>`;
            console.log(`[${id}]`, message);
        }

        function updateState() {
            const state = {
                initialized,
                functions: {
                    initStrudel: typeof window.initStrudel,
                    note: typeof window.note,
                    sound: typeof window.sound,
                    stack: typeof window.stack,
                    hush: typeof window.hush
                },
                testPatterns: testPatterns.length
            };
            document.getElementById('stateContent').textContent = JSON.stringify(state, null, 2);
        }

        // Test 1: Initialize
        document.getElementById('test1').addEventListener('click', async () => {
            try {
                log('result1', '⏳ Initializing Strudel...', 'info');

                if (typeof window.initStrudel !== 'function') {
                    log('result1', '❌ initStrudel not found', 'error');
                    return;
                }

                await window.initStrudel({
                    prebake: () => samples('github:tidalcycles/dirt-samples')
                });

                initialized = true;
                log('result1', '✅ Strudel initialized successfully!', 'success');
                updateState();
            } catch (error) {
                log('result1', '❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Test 2: Check Functions
        document.getElementById('test2').addEventListener('click', () => {
            const funcs = ['note', 'sound', 'stack', 'hush', 's', 'n', 'fast', 'slow', 'gain', 'cpm'];
            const available = [];
            const missing = [];

            funcs.forEach(fn => {
                if (typeof window[fn] === 'function') {
                    available.push(fn);
                } else {
                    missing.push(fn);
                }
            });

            let msg = `✅ Available: ${available.join(', ')}\n`;
            if (missing.length > 0) {
                msg += `❌ Missing: ${missing.join(', ')}`;
            }

            log('result2', msg, missing.length > 0 ? 'warning' : 'success');
            updateState();
        });

        // Test 3: Create Patterns
        document.getElementById('test3').addEventListener('click', () => {
            try {
                if (!initialized) {
                    log('result3', '⚠️ Run Test 1 first!', 'warning');
                    return;
                }

                log('result3', '⏳ Creating patterns...', 'info');
                testPatterns = [];

                // Create drum pattern
                const drums = window.sound('bd hh sd hh');
                testPatterns.push(drums);
                log('result3', `✓ Created drums pattern: ${drums}`, 'success');

                // Create melody pattern
                const melody = window.note('c4 e4 g4 c5').s('triangle');
                testPatterns.push(melody);
                log('result3', `✓ Created melody pattern: ${melody}`, 'success');

                log('result3', `✅ Created ${testPatterns.length} patterns`, 'success');
                updateState();
            } catch (error) {
                log('result3', '❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Test 4: Stack Patterns
        document.getElementById('test4').addEventListener('click', () => {
            try {
                if (testPatterns.length === 0) {
                    log('result4', '⚠️ Run Test 3 first!', 'warning');
                    return;
                }

                log('result4', `⏳ Stacking ${testPatterns.length} patterns...`, 'info');

                const stacked = window.stack(...testPatterns);
                log('result4', `✅ Stacked successfully: ${stacked}`, 'success');

                window.stackedPattern = stacked;
                updateState();
            } catch (error) {
                log('result4', '❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Test 5: Play
        document.getElementById('test5').addEventListener('click', () => {
            try {
                if (!window.stackedPattern) {
                    log('result5', '⚠️ Run Test 4 first!', 'warning');
                    return;
                }

                log('result5', '⏳ Playing stacked pattern...', 'info');
                window.stackedPattern.play();
                log('result5', '✅ Playing! Listen for audio...', 'success');
            } catch (error) {
                log('result5', '❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Test 6: Stop
        document.getElementById('test6').addEventListener('click', () => {
            try {
                if (typeof window.hush === 'function') {
                    window.hush();
                    log('result6', '✅ Stopped all patterns', 'success');
                } else {
                    log('result6', '❌ hush function not available', 'error');
                }
            } catch (error) {
                log('result6', '❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        });

        // Initial state
        updateState();
        setInterval(updateState, 1000);
    </script>
</body>
</html>
