<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ORBITAL SEQUENCER</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            touch-action: none;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: #000;
            border-bottom: 3px solid #0f0;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0f0;
            margin: 0;
        }

        #status {
            font-size: 11px;
            color: #0a0;
            margin-top: 5px;
            font-weight: bold;
        }

        #canvasContainer {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #controls {
            background: #000;
            border-top: 3px solid #0f0;
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 900;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.1s;
            touch-action: manipulation;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            background: #000;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }

        .btn-play {
            color: #0f0;
            border-color: #0f0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .btn-play.active {
            background: #0f0;
            color: #000;
        }

        .btn-stop {
            color: #f00;
            border-color: #f00;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .btn-clear {
            color: #ff0;
            border-color: #ff0;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.3);
        }

        #info {
            position: absolute;
            top: 80px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f0;
            padding: 10px;
            font-size: 10px;
            max-width: 200px;
            z-index: 10;
        }

        .legend {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>◉ ORBITAL SEQUENCER ◉</h1>
            <div id="status">TAP ORBITS TO CREATE PATTERNS</div>
        </div>

        <div id="canvasContainer">
            <canvas id="canvas"></canvas>

            <div id="info">
                <div class="legend">
                    <div class="color-box" style="background: #f00;"></div>
                    <span>DRUMS</span>
                </div>
                <div class="legend">
                    <div class="color-box" style="background: #0ff;"></div>
                    <span>HI-HATS</span>
                </div>
                <div class="legend">
                    <div class="color-box" style="background: #0f0;"></div>
                    <span>BASS</span>
                </div>
                <div class="legend">
                    <div class="color-box" style="background: #f0f;"></div>
                    <span>MELODY</span>
                </div>
                <div class="legend">
                    <div class="color-box" style="background: #ff0;"></div>
                    <span>PERC</span>
                </div>
                <div style="margin-top: 10px; border-top: 1px solid #0f0; padding-top: 8px;">
                    TAP: TOGGLE STEP<br>
                    CENTER: TEMPO
                </div>
            </div>
        </div>

        <div id="controls">
            <button class="btn btn-play" id="playBtn">▶ ENGAGE</button>
            <button class="btn btn-stop" id="stopBtn">■ STOP</button>
            <button class="btn btn-clear" id="clearBtn">✕ CLEAR</button>
        </div>
    </div>

    <script src="https://unpkg.com/@strudel/web@latest"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Track definitions
        const tracks = [
            {
                name: 'DRUMS',
                color: '#f00',
                radius: 0,
                pattern: 'bd sd',
                sound: (step) => `bd sd`.split(' ')[step % 2]
            },
            {
                name: 'HI-HATS',
                color: '#0ff',
                radius: 0,
                pattern: 'hh*4',
                sound: () => 'hh'
            },
            {
                name: 'BASS',
                color: '#0f0',
                radius: 0,
                pattern: 'c2 e2 g2 c2',
                notes: ['c2', 'e2', 'g2', 'c2'],
                synth: 'sawtooth'
            },
            {
                name: 'MELODY',
                color: '#f0f',
                radius: 0,
                pattern: 'c4 e4 g4 c5',
                notes: ['c4', 'e4', 'g4', 'c5'],
                synth: 'triangle'
            },
            {
                name: 'PERC',
                color: '#ff0',
                radius: 0,
                pattern: '~ cp ~ cp',
                sound: (step) => step % 2 === 1 ? 'cp' : null
            }
        ];

        // State
        let centerX, centerY, innerRadius, ringWidth, stepCount = 16;
        let sequences = tracks.map(() => Array(stepCount).fill(false));
        let currentStep = 0;
        let isPlaying = false;
        let strudelInit = false;
        let animationFrame;
        let rotation = 0;
        let bpm = 120;

        // Initialize canvas size
        function resizeCanvas() {
            const size = Math.min(window.innerWidth, window.innerHeight - 200);
            canvas.width = size;
            canvas.height = size;
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
            innerRadius = 40;
            ringWidth = (Math.min(canvas.width, canvas.height) / 2 - innerRadius - 20) / tracks.length;

            tracks.forEach((track, i) => {
                track.radius = innerRadius + ringWidth * (i + 0.5);
            });

            draw();
        }

        // Draw the orbital interface
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center circle (tempo control)
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, innerRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Draw BPM in center
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(bpm, centerX, centerY - 5);
            ctx.font = 'bold 10px Courier New';
            ctx.fillText('BPM', centerX, centerY + 10);

            // Draw playhead
            if (isPlaying) {
                const angle = (rotation + (currentStep / stepCount) * Math.PI * 2) - Math.PI / 2;
                const maxRadius = innerRadius + ringWidth * tracks.length;
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + Math.cos(angle) * maxRadius,
                    centerY + Math.sin(angle) * maxRadius
                );
                ctx.stroke();

                // Glowing dot
                ctx.fillStyle = '#0f0';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#0f0';
                ctx.beginPath();
                ctx.arc(
                    centerX + Math.cos(angle) * maxRadius,
                    centerY + Math.sin(angle) * maxRadius,
                    5, 0, Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw tracks and steps
            tracks.forEach((track, trackIdx) => {
                const radius = track.radius;

                // Draw track ring
                ctx.strokeStyle = track.color;
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Draw steps
                for (let step = 0; step < stepCount; step++) {
                    const angle = (step / stepCount) * Math.PI * 2 - Math.PI / 2 + rotation;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;

                    const isActive = sequences[trackIdx][step];
                    const isCurrent = isPlaying && step === currentStep;

                    // Draw step
                    if (isActive) {
                        ctx.fillStyle = track.color;
                        ctx.strokeStyle = track.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = track.color;
                    } else {
                        ctx.fillStyle = '#111';
                        ctx.strokeStyle = '#333';
                        ctx.shadowBlur = 0;
                    }

                    ctx.lineWidth = isCurrent ? 3 : 2;
                    ctx.beginPath();
                    ctx.arc(x, y, isActive ? 8 : 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            });

            // Draw grid lines from center
            ctx.strokeStyle = '#0f0';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;
            for (let i = 0; i < stepCount; i++) {
                const angle = (i / stepCount) * Math.PI * 2 - Math.PI / 2 + rotation;
                const maxRadius = innerRadius + ringWidth * tracks.length;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(
                    centerX + Math.cos(angle) * maxRadius,
                    centerY + Math.sin(angle) * maxRadius
                );
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        // Handle touch/click
        function handleInteraction(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = x * scaleX;
            const canvasY = y * scaleY;

            const dx = canvasX - centerX;
            const dy = canvasY - centerY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            let angle = Math.atan2(dy, dx) + Math.PI / 2 - rotation;
            if (angle < 0) angle += Math.PI * 2;

            // Check if clicking center (tempo control)
            if (distance < innerRadius) {
                // Could add tempo adjustment here
                return;
            }

            // Find which track ring was clicked
            tracks.forEach((track, trackIdx) => {
                const minR = track.radius - ringWidth / 2;
                const maxR = track.radius + ringWidth / 2;

                if (distance >= minR && distance <= maxR) {
                    // Find which step
                    const step = Math.floor((angle / (Math.PI * 2)) * stepCount) % stepCount;
                    sequences[trackIdx][step] = !sequences[trackIdx][step];
                    draw();
                }
            });
        }

        canvas.addEventListener('mousedown', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction);

        // Initialize Strudel
        async function initStrudel() {
            if (strudelInit) return true;
            try {
                status.textContent = '>> LOADING SOUND BANKS <<';
                await window.initStrudel({
                    prebake: () => samples('github:tidalcycles/dirt-samples')
                });
                strudelInit = true;
                status.textContent = '[ ARMED AND READY ]';
                return true;
            } catch (error) {
                status.textContent = 'XX ERROR: ' + error.message;
                return false;
            }
        }

        // Play patterns
        function playSequence() {
            if (!strudelInit) return;

            try {
                const patterns = [];

                tracks.forEach((track, trackIdx) => {
                    const activeSteps = [];
                    sequences[trackIdx].forEach((active, step) => {
                        if (active) {
                            if (track.synth) {
                                activeSteps.push(track.notes[step % track.notes.length]);
                            } else {
                                const snd = track.sound(step);
                                if (snd) activeSteps.push(snd);
                            }
                        } else {
                            activeSteps.push('~');
                        }
                    });

                    if (activeSteps.some(s => s !== '~')) {
                        let pattern;
                        if (track.synth) {
                            pattern = window.note(activeSteps.join(' ')).s(track.synth);
                            if (track.name === 'BASS') {
                                pattern = pattern.lpf(200);
                            }
                        } else {
                            pattern = window.sound(activeSteps.join(' '));
                        }
                        pattern = pattern.cpm(bpm / 4);
                        patterns.push(pattern);
                    }
                });

                if (patterns.length > 0) {
                    if (window.hush) window.hush();
                    window.stack(...patterns).play();
                }
            } catch (error) {
                console.error('Play error:', error);
            }
        }

        // Animation loop
        function animate() {
            if (isPlaying) {
                draw();
                animationFrame = requestAnimationFrame(animate);
            }
        }

        // Sequencer clock
        let stepInterval;
        function startClock() {
            const stepDuration = (60000 / bpm) / 4; // 16th notes
            stepInterval = setInterval(() => {
                currentStep = (currentStep + 1) % stepCount;
                if (currentStep === 0) {
                    playSequence();
                }
            }, stepDuration);
        }

        function stopClock() {
            if (stepInterval) {
                clearInterval(stepInterval);
                stepInterval = null;
            }
        }

        // Controls
        playBtn.addEventListener('click', async () => {
            if (!await initStrudel()) return;

            isPlaying = !isPlaying;

            if (isPlaying) {
                playBtn.classList.add('active');
                playBtn.textContent = '⏸ ACTIVE';
                status.textContent = '>> SYSTEM RUNNING <<';
                currentStep = 0;
                playSequence();
                startClock();
                animate();
            } else {
                playBtn.classList.remove('active');
                playBtn.textContent = '▶ ENGAGE';
                status.textContent = '[ PAUSED ]';
                stopClock();
                if (window.hush) window.hush();
            }
        });

        stopBtn.addEventListener('click', () => {
            isPlaying = false;
            playBtn.classList.remove('active');
            playBtn.textContent = '▶ ENGAGE';
            status.textContent = '[ STOPPED ]';
            stopClock();
            currentStep = 0;
            if (window.hush) window.hush();
            draw();
        });

        clearBtn.addEventListener('click', () => {
            sequences = tracks.map(() => Array(stepCount).fill(false));
            draw();
            status.textContent = 'SEQUENCE CLEARED';
        });

        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Add some default pattern
        // Kick on 1 and 9
        sequences[0][0] = true;
        sequences[0][8] = true;
        // Snare on 5 and 13
        sequences[0][4] = true;
        sequences[0][12] = true;

        draw();
    </script>
</body>
</html>
