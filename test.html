<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Strudel Test Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
        }

        h1 {
            text-align: center;
            color: #00ff00;
        }

        button {
            padding: 15px 25px;
            margin: 8px;
            font-size: 18px;
            background: #333;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 10px auto;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.95);
            background: #00ff00;
            color: #1a1a1a;
        }

        #log {
            background: #0a0a0a;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
            border: 1px solid #00ff00;
            border-radius: 4px;
            font-size: 14px;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
        }

        .log-success {
            color: #00ff00;
        }

        .log-error {
            color: #ff0000;
        }

        .log-info {
            color: #ffff00;
        }
    </style>
</head>
<body>
    <h1>🧪 Strudel Diagnostics</h1>

    <button id="test1">Test 1: Load @strudel/web</button>
    <button id="test2">Test 2: Initialize Strudel</button>
    <button id="test3">Test 3: Check Functions Available</button>
    <button id="test4">Test 4: Play Simple Sound</button>
    <button id="test5">Test 5: Stop All Sounds</button>
    <button id="clear">Clear Log</button>

    <div id="log"></div>

    <script type="module">
        const logDiv = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        document.getElementById('clear').addEventListener('click', () => {
            logDiv.innerHTML = '';
        });

        log('Page loaded', 'success');

        // Test 1: Load @strudel/web
        document.getElementById('test1').addEventListener('click', async () => {
            try {
                log('Loading @strudel/web module...', 'info');
                const strudelWeb = await import('@strudel/web');
                log('✅ @strudel/web loaded successfully', 'success');
                log(`Available exports: ${Object.keys(strudelWeb).join(', ')}`, 'info');
            } catch (error) {
                log(`❌ Failed to load @strudel/web: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        });

        // Test 2: Initialize Strudel
        let strudelInitialized = false;
        document.getElementById('test2').addEventListener('click', async () => {
            try {
                log('Importing initStrudel...', 'info');
                const { initStrudel } = await import('@strudel/web');
                log('✅ initStrudel imported', 'success');

                log('Calling initStrudel()...', 'info');
                await initStrudel();
                strudelInitialized = true;
                log('✅ Strudel initialized successfully', 'success');
            } catch (error) {
                log(`❌ Failed to initialize: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        });

        // Test 3: Check Functions Available
        document.getElementById('test3').addEventListener('click', async () => {
            try {
                log('Checking global functions...', 'info');

                const functions = ['sound', 'note', 'stack', 'hush', 's', 'n', 'fast', 'slow'];

                for (const fn of functions) {
                    if (typeof window[fn] === 'function') {
                        log(`✅ ${fn} is available`, 'success');
                    } else {
                        log(`❌ ${fn} is NOT available (type: ${typeof window[fn]})`, 'error');
                    }
                }
            } catch (error) {
                log(`❌ Error checking functions: ${error.message}`, 'error');
            }
        });

        // Test 4: Play Simple Sound
        document.getElementById('test4').addEventListener('click', async () => {
            try {
                if (!strudelInitialized) {
                    log('⚠️ Please run Test 2 first to initialize Strudel', 'error');
                    return;
                }

                log('Attempting to play sound("bd hh")...', 'info');

                if (typeof sound === 'undefined') {
                    log('❌ sound() function not found. Importing from @strudel/web...', 'error');
                    const { sound: soundFn } = await import('@strudel/web');
                    window.sound = soundFn;
                }

                const pattern = sound("bd hh");
                log(`✅ Pattern created: ${pattern}`, 'success');

                log('Calling .play()...', 'info');
                pattern.play();
                log('✅ .play() called successfully', 'success');
                log('🔊 Listen for audio...', 'info');
            } catch (error) {
                log(`❌ Failed to play sound: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        });

        // Test 5: Stop All Sounds
        document.getElementById('test5').addEventListener('click', async () => {
            try {
                log('Attempting to stop all sounds...', 'info');

                if (typeof hush === 'function') {
                    hush();
                    log('✅ hush() called successfully', 'success');
                } else {
                    log('❌ hush() function not available', 'error');
                }
            } catch (error) {
                log(`❌ Failed to stop sounds: ${error.message}`, 'error');
            }
        });

        // Log any unhandled errors
        window.addEventListener('error', (e) => {
            log(`❌ Uncaught error: ${e.message}`, 'error');
            log(`  at ${e.filename}:${e.lineno}:${e.colno}`, 'error');
        });

        window.addEventListener('unhandledrejection', (e) => {
            log(`❌ Unhandled promise rejection: ${e.reason}`, 'error');
        });

        log('Test page ready. Tap "Test 1" to begin.', 'success');
    </script>
</body>
</html>
